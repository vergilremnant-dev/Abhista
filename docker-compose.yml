version: '3.8'

services:
  # Database Service (PostgreSQL)
  database:
    image: postgres:16-alpine
    container_name: dbc-database-prod
    restart: always
    environment:
      POSTGRES_USER: dbc_admin
      POSTGRES_PASSWORD: secure_db_password_change_me
      POSTGRES_DB: dbc_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbc_admin -d dbc_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Service (DBC Platform Container)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbc-app-prod
    restart: always
    ports:
      - "5174:5174"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dbc_admin:secure_db_password_change_me@database:5432/dbc_marketplace?schema=public
      JWT_SECRET: secure_production_jwt_secret_token_change_me
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
